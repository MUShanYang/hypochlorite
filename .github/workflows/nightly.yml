name: Nightly

on:
  push:
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare versioned APK
        id: apk
        run: |
          short_sha="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME//\//-}"
          # One push → one immutable version (unique tag + unique APK name).
          tag="nightly-${short_sha}"
          out="hypochlorite-${short_sha}.apk"
          src="app/build/outputs/apk/debug/app-debug.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=Nightly ${branch}@${short_sha}" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: hypochlorite-${{ github.sha }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.title }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            自动构建。

            - 分支: `${{ github.ref_name }}`
            - 提交: `${{ github.sha }}`
            - 标签: `${{ steps.apk.outputs.tag }}`
            - 安装包: `${{ steps.apk.outputs.path }}`
            - 工作流: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
