name: Nightly

on:
  push:
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare nightly APK
        id: apk
        run: |
          short_sha="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME//\//-}"
          src="app/build/outputs/apk/debug/app-debug.apk"
          # Stable name so Releases always shows one obvious download.
          out="hypochlorite-nightly.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "title=Nightly ${branch}@${short_sha}" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: hypochlorite-nightly-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Clear previous nightly assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Drop every old APK on the rolling nightly release so only the new file remains.
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" --jq .id 2>/dev/null || true)
          if [ -n "$release_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq '.[].id' \
              | while read -r asset_id; do
                  [ -n "$asset_id" ] || continue
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                done
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: ${{ steps.apk.outputs.title }}
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            自动夜间构建（推送触发）。

            - 分支: `${{ github.ref_name }}`
            - 提交: `${{ github.sha }}`
            - 工作流: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 安装包: `hypochlorite-nightly.apk`（固定文件名，每次覆盖）
