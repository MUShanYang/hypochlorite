name: Nightly

on:
  push:
    # 只跟分支推送。裸 `push:` 也会匹配 tag，所以打正式发布 tag 时会顺带触发出一个
    # nightly-<sha> 的 prerelease —— 和 release.yml 的正式包重复。
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # nightly 专用密钥，和正式发布密钥（release.yml 用的那套 KEYSTORE_*）严格分开：
      # 固定签名让同一台机器上的 nightly 能直接覆盖升级，但绝不拿正式发布密钥去签 debug 包。
      HYPO_KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
      HYPO_KEYSTORE_PASSWORD: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
      HYPO_KEY_ALIAS: ${{ secrets.NIGHTLY_KEY_ALIAS }}
      HYPO_KEY_PASSWORD: ${{ secrets.NIGHTLY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        if: ${{ env.HYPO_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$HYPO_KEYSTORE_BASE64" | base64 --decode > nightly.p12
          echo "HYPO_KEYSTORE_FILE=$GITHUB_WORKSPACE/nightly.p12" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Remove signing keystore
        if: ${{ always() && env.HYPO_KEYSTORE_BASE64 != '' }}
        run: rm -f nightly.p12

      - name: Prepare versioned APK and release notes
        id: apk
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME//\//-}"
          tag="nightly-${short_sha}"
          out="hypochlorite-${short_sha}.apk"
          src="app/build/outputs/apk/debug/app-debug.apk"
          cp "$src" "$out"

          subject=$(git log -1 --pretty=%s "$GITHUB_SHA")
          # Title stays readable in Releases list: subject + short sha
          title="${subject}"

          # Commits in this push so the release shows what changed.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${GITHUB_SHA}"
          else
            range="${GITHUB_SHA}^..${GITHUB_SHA}"
            git rev-parse --verify "${GITHUB_SHA}^" >/dev/null 2>&1 || range="$GITHUB_SHA"
          fi

          {
            echo "## 本版本提交"
            echo
            git log --reverse --pretty=format:'### %s%n%n- 提交: `%h`%n- 作者: %an%n%n%b' "$range"
            echo
            echo
            echo "---"
            echo
            echo "- 分支: \`${branch}\`"
            echo "- 完整提交: \`${GITHUB_SHA}\`"
            echo "- 标签: \`${tag}\`"
            echo "- 安装包: \`${out}\`"
            echo "- 工作流: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-notes.md

          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          ls -lh "$out"
          echo "----- release notes -----"
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: hypochlorite-${{ github.sha }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.title }}
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
          body_path: release-notes.md
